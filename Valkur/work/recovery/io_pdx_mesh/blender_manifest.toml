schema_version = "1.0.0"

# Required
id = "io_pdx_mesh"
name = "STNH Mesh IO"
maintainer = "STNH Team"
tagline = "Import/Export Paradox Clausewitz .mesh/.anim files (STNH fork)"
type = "add-on"
version = "1.1.0"
blender_version_min = "4.2.0"
license = ["SPDX:GPL-3.0-or-later"]

# Optional
tags = ["Import-Export", "Mesh", "Animation"]
website = "https://github.com/Grinsel/stnh_mesh_IO"
current_git_tag = 1.1
maya_support_min = [2018]
blender_support_min = [3, 6, 4]
doc_url = "https://github.com/Grinsel/stnh_mesh_IO#readme"
forum_url = "https://forum.paradoxplaza.com/forum/index.php?forums/clausewitz-maya-exporter-modding-tool.935/"


[permissions]
files = "Import/export PDX Mesh & Anim files, save user settings to disk"
network = "Check GithubAPI for extension updates, release notes"

[build]
paths_exclude_pattern = [
    "__pycache__/",
    "external/numpy_maya/",
    "test files/",
    "*.pyc",
    ".*/",
]
